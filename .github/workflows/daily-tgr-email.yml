name: Daily TGR Customer Email

# Delivers yesterday's TGR (Green Room) customer summary at 08:30 Asia/Amman.
#
# Business day = 03:00 -> 03:00 (cut-off 03:00 every night) — the same
# window as the Daily Sales email, so the two reports always agree.
#
# Timing: GitHub's cron is best-effort and for this repo has been starting
# runs 5-6.5 hours late. So the workflow is triggered EARLY (22:07-06:07
# Amman) and a scheduled run holds itself until exactly 08:30 before sending
# (scripts/daily_email_schedule.py). With triggers two hours apart, any
# delay from 0 to ~10 hours still lands the email at 08:30.
#
# Exactly one email per day: right before sending, a run claims the day by
# pushing the git tag "sent-tgr-<date>". GitHub rejects a tag that already
# exists, so only the first run can ever send that day's report; all other
# triggers skip. Runs are also serialised by the concurrency group.
# (The keepalive that stops GitHub disabling schedules lives in the Daily
# Sales Email workflow — one per repo is enough.)
on:
  schedule:
    - cron: "7 19 * * *"    # 22:07 Amman
    - cron: "7 21 * * *"    # 00:07 Amman
    - cron: "7 23 * * *"    # 02:07 Amman
    - cron: "7 1 * * *"     # 04:07 Amman
    - cron: "7 3 * * *"     # 06:07 Amman (also the late fallback)
  workflow_dispatch:
    inputs:
      target_date:
        description: "Date to report on. Blank = today. Accepts YYYY-MM-DD, 'today', or 'yesterday'. Manual runs send immediately."
        required: false
        default: ""
      dry_run:
        description: "Build the report and log it, but do not send the email"
        type: boolean
        required: false
        default: false

concurrency:
  group: daily-tgr-email
  cancel-in-progress: false

permissions:
  contents: write     # push the once-per-day claim tag

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 345          # a run may hold up to 5.5h for 08:30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF dependency
        run: pip install --disable-pip-version-check --no-input reportlab==4.2.5

      - name: Build and send (scheduled runs hold until 08:30 Amman)
        id: send
        env:
          SEND_AT:       "08:30"
          GITHUB_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          ODOO_URL:      ${{ secrets.ODOO_URL }}
          ODOO_DB:       ${{ secrets.ODOO_DB }}
          ODOO_LOGIN:    ${{ secrets.ODOO_LOGIN }}
          ODOO_API_KEY:  ${{ secrets.ODOO_API_KEY }}
          SMTP_HOST:     ${{ secrets.SMTP_HOST }}
          SMTP_PORT:     ${{ secrets.SMTP_PORT }}
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM:    ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:      ${{ secrets.EMAIL_TO }}
          EMAIL_CC:      ${{ secrets.EMAIL_CC }}
          # Extra copies: Firas (added here at the owner's request; this repo is
          # public, so the address is visible) + anyone in the optional
          # SALES_REPORT_CC secret. Same list as the Daily Sales email.
          EMAIL_CC_EXTRA: "f.abunaffa@myfyxx.com,${{ secrets.SALES_REPORT_CC }}"
          REPLY_TO:      ${{ secrets.REPLY_TO }}
          TARGET_DATE:   ${{ inputs.target_date }}
          DRY_RUN:       ${{ inputs.dry_run }}
        run: python scripts/send_tgr_daily_email.py

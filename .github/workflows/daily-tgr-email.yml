name: Daily TGR Customer Email

# Tries 4 times each night, 22:00 / 23:00 / 00:00 / 02:00 UTC
# (= 01:00 / 02:00 / 03:00 / 05:00 Asia/Amman). The script's dedup
# guard ensures only the FIRST successful fire actually sends an email —
# later fires query the workflow run history and short-circuit if a
# scheduled sibling already succeeded in the last 12 hours.
#
# Why 4 fires: GitHub Actions cron on personal repos is best-effort and
# regularly skips runs or delays them by hours. Four spread-out attempts
# give >99% probability that at least one fires before the next day.
#
# Scheduled fires always report YESTERDAY's data (trading day fully
# closed). Manual workflow_dispatch can override via the date input.
# (Jordan is UTC+3 year-round — no DST since 2022.)
on:
  schedule:
    - cron: "0 22 * * *"   # 01:00 Amman, primary
    - cron: "0 23 * * *"   # 02:00 Amman, backup #1
    - cron: "0 0 * * *"    # 03:00 Amman, backup #2
    - cron: "0 2 * * *"    # 05:00 Amman, last resort
  workflow_dispatch:
    inputs:
      target_date:
        description: "Date to report on. Blank = today (manual) / yesterday (scheduled). Accepts YYYY-MM-DD, 'today', or 'yesterday'."
        required: false
        default: ""

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF dependency
        run: pip install --disable-pip-version-check --no-input reportlab==4.2.5

      - name: Send TGR daily email
        env:
          # GitHub auto-injects these — used by the dedup guard so backup
          # cron fires can detect that an earlier fire already sent.
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:   ${{ github.repository }}
          GITHUB_RUN_ID:       ${{ github.run_id }}
          GITHUB_EVENT_NAME:   ${{ github.event_name }}
          ODOO_URL:      ${{ secrets.ODOO_URL }}
          ODOO_DB:       ${{ secrets.ODOO_DB }}
          ODOO_LOGIN:    ${{ secrets.ODOO_LOGIN }}
          ODOO_API_KEY:  ${{ secrets.ODOO_API_KEY }}
          SMTP_HOST:     ${{ secrets.SMTP_HOST }}
          SMTP_PORT:     ${{ secrets.SMTP_PORT }}
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM:    ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:      ${{ secrets.EMAIL_TO }}
          EMAIL_CC:      ${{ secrets.EMAIL_CC }}
          REPLY_TO:      ${{ secrets.REPLY_TO }}
          # Scheduled cron defaults to yesterday's data (day just closed).
          # Manual workflow_dispatch uses whatever the user typed (blank = today).
          TARGET_DATE: ${{ github.event_name == 'schedule' && 'yesterday' || inputs.target_date }}
        run: python scripts/send_tgr_daily_email.py

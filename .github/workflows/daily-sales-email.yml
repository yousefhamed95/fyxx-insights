name: Daily Sales Email

# Delivers yesterday's sales-by-channel report at 08:30 Asia/Amman.
#
# Business day = 03:00 -> 03:00 (cut-off 03:00 every night), so late-night
# trade belongs to the day it happened and no hour is counted twice.
#
# Timing: GitHub's cron is best-effort and for this repo has been starting
# runs 5-6.5 hours late. So the workflow is triggered EARLY (22:13-06:13
# Amman) and a scheduled run holds itself until exactly 08:30 before sending
# (scripts/daily_email_schedule.py). With triggers two hours apart, any
# delay from 0 to ~10 hours still lands the email at 08:30.
#
# Exactly one email per day: right before sending, a run claims the day by
# pushing the git tag "sent-sales-<date>". GitHub rejects a tag that already
# exists, so only the first run can ever send that day's report; all other
# triggers skip. Runs are also serialised by the concurrency group.
on:
  schedule:
    - cron: "13 19 * * *"   # 22:13 Amman
    - cron: "13 21 * * *"   # 00:13 Amman
    - cron: "13 23 * * *"   # 02:13 Amman
    - cron: "13 1 * * *"    # 04:13 Amman
    - cron: "13 3 * * *"    # 06:13 Amman (also the late fallback)
  workflow_dispatch:
    inputs:
      target_date:
        description: "Business day to report. Blank = yesterday. Accepts YYYY-MM-DD, 'today', 'yesterday'. Manual runs send immediately."
        required: false
        default: ""
      dry_run:
        description: "Build the report and log it, but do not send the email"
        type: boolean
        required: false
        default: false

concurrency:
  group: daily-sales-email
  cancel-in-progress: false

permissions:
  contents: write     # push the once-per-day claim tag + keepalive commit

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 345          # a run may hold up to 5.5h for 08:30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and send (scheduled runs hold until 08:30 Amman)
        id: send
        env:
          SEND_AT:       "08:30"
          GITHUB_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          ODOO_URL:      ${{ secrets.ODOO_URL }}
          ODOO_DB:       ${{ secrets.ODOO_DB }}
          ODOO_LOGIN:    ${{ secrets.ODOO_LOGIN }}
          ODOO_API_KEY:  ${{ secrets.ODOO_API_KEY }}
          SMTP_HOST:     ${{ secrets.SMTP_HOST }}
          SMTP_PORT:     ${{ secrets.SMTP_PORT }}
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM:    ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:      ${{ secrets.EMAIL_TO }}
          EMAIL_CC:      ${{ secrets.EMAIL_CC }}
          # Extra copies: Firas (added here at the owner's request; this repo is
          # public, so the address is visible) + anyone in the optional
          # SALES_REPORT_CC secret. The TGR workflow uses the same list.
          EMAIL_CC_EXTRA: "f.abunaffa@myfyxx.com,${{ secrets.SALES_REPORT_CC }}"
          REPLY_TO:      ${{ secrets.REPLY_TO }}
          TARGET_DATE:   ${{ inputs.target_date }}
          DRY_RUN:       ${{ inputs.dry_run }}
        run: python scripts/send_daily_sales_email.py

      # GitHub disables scheduled workflows in public repos after 60 days
      # without a commit, which would silently stop both daily emails. If
      # the repo has been quiet for 45+ days, push an empty commit.
      # (If you push from a local clone later, `git pull --rebase` first.)
      - name: Keepalive
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          last=$(git log -1 --format=%ct)
          age=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last commit is $age day(s) old."
          if [ "$age" -ge 45 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive so the scheduled emails stay enabled"
            git push
          fi

name: Fyxx Host Data Sync

# Refreshes the hosted dashboard's SNAPSHOT (history + lines + P&L +
# delivery) at umg.jo/dashboard/fyxx/ by running the Odoo -> JSON exporter
# and uploading via FTP. Runs every 3 hours to keep past days complete;
# TODAY is already live via live.php on the host, so this cron only needs
# to complete recent history, not provide real-time.
# NOTE: schedule stays OFF until the FTP_HOST / FTP_USER / FTP_PASSWORD
# secrets are added in the repo (Settings > Secrets > Actions), otherwise
# every run fails and sends failure emails. TODAY is already real-time via
# live.php on the host, so this snapshot refresh is only needed to complete
# past days — run it manually (Actions > Run workflow) or flip the cron on
# once the FTP secrets exist.
on:
  workflow_dispatch:

concurrency:
  group: fyxx-host-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export Odoo data and upload to host
        env:
          ODOO_URL:     ${{ secrets.ODOO_URL }}
          ODOO_DB:      ${{ secrets.ODOO_DB }}
          ODOO_LOGIN:   ${{ secrets.ODOO_LOGIN }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          FTP_HOST:     ${{ secrets.FTP_HOST }}
          FTP_USER:     ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python hosted/fyxx_export.py
